<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MetroDom">
  <title>MetroDom</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="pair" hidden>
    <h1>MetroDom</h1>
    <p>Scan the QR code you were given, open the link the Conductor printed, or paste its token.</p>
    <form id="pair-form">
      <label for="token">Token</label>
      <input id="token" name="token" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit">Connect</button>
    </form>
    <p id="pair-error" class="error" role="alert"></p>
  </main>

  <main id="band" hidden>
    <header>
      <span id="link" class="dot" title="Connection" aria-label="Connection"></span>
      <div class="title">
        <div id="song">–</div>
        <div id="status" class="muted">Connecting…</div>
        <div id="role" class="muted"></div>
      </div>
      <button id="forget" class="ghost" type="button" title="Forget this token on this device">Forget</button>
    </header>

    <section class="now" aria-live="polite">
      <div class="bar"><div id="progress"></div></div>
      <div class="row muted"><span id="time">0:00 / 0:00</span><span id="section"></span></div>
      <div class="tempo"><span id="bpm">–</span><span class="muted"> BPM</span> <span id="tempo-detail" class="muted"></span></div>
      <div id="following" class="muted"></div>
    </section>

    <section class="controls">
      <button id="startstop" type="button" class="primary" data-grant="transport">Start</button>
      <button id="next" type="button" data-grant="transport">Next</button>
      <button id="slower" type="button" aria-label="Slower" data-grant="tempo">− Tempo</button>
      <button id="faster" type="button" aria-label="Faster" data-grant="tempo">Tempo +</button>
      <button id="tap" type="button" data-grant="tempo">Tap</button>
      <button id="vamp" type="button" data-grant="sections">Vamp</button>
      <button id="outro" type="button" data-grant="sections">Outro</button>
    </section>

    <button id="panic" type="button" class="panic" data-grant="panic">PANIC</button>

    <section>
      <h2>Queue</h2>
      <ol id="queue" class="queue"></ol>
      <p id="queue-empty" class="muted" hidden>Nothing queued.</p>
    </section>

    <section id="library-panel" data-grant="queue.edit" hidden>
      <h2>Library</h2>
      <div class="search">
        <input id="library-filter" type="search" placeholder="Find a song" aria-label="Find a song" autocomplete="off">
        <button id="library-refresh" type="button" class="ghost">Refresh</button>
      </div>
      <ul id="library" class="library"></ul>
      <p id="library-empty" class="muted" hidden></p>
    </section>

    <section id="invite-panel" data-grant="tokens" hidden>
      <h2>Invite</h2>
      <form id="invite-form" class="invite">
        <label>Who
          <select id="invite-role">
            <option value="guest">Guest</option>
            <option value="operator">Operator</option>
          </select>
        </label>
        <label>Name <input id="invite-label" maxlength="60" placeholder="Table 4, Sam…" autocomplete="off"></label>
        <label>Hours <input id="invite-hours" type="number" min="0.5" step="0.5" inputmode="decimal" placeholder="policy maximum"></label>
        <button type="submit">Make a QR code</button>
      </form>
      <div id="invite-result" class="invite-result" hidden>
        <img id="invite-qr" alt="QR code to join">
        <p id="invite-who" class="muted"></p>
        <div class="row">
          <button id="invite-copy" type="button" class="ghost">Copy link</button>
          <button id="invite-share" type="button" class="ghost" hidden>Share</button>
        </div>
      </div>
      <h3 class="muted">Handed out</h3>
      <ul id="tokens" class="tokens"></ul>
    </section>

    <section>
      <h2>Instruments</h2>
      <ul id="instruments"></ul>
    </section>
    <section>
      <h2>Messages</h2>
      <ul id="messages" class="muted"></ul>
    </section>
  </main>
</body>
</html>
