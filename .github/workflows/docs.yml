name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_hardware.py
