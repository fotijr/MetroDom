name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Brain firmware host tests
        run: make -C Instruments/metrodom_brain/test

  # The real compile against the pinned arduino-pico core and libraries (sketch.yaml): the host
  # tests above can't catch a sketch that doesn't build for the Pico (plan 0006 N5, TD-29).
  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-${{ hashFiles('Instruments/metrodom_brain/sketch.yaml') }}
      - name: Compile the brain for ${{ matrix.board }}
        run: make -C Instruments/metrodom_brain build BOARD=${{ matrix.board }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrodom-brain-${{ matrix.board }}
          path: Instruments/metrodom_brain/build/${{ matrix.board }}/metrodom_brain.ino.uf2

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Best effort: hosted runners' Azure kernels don't always ship the ALSA sequencer modules
      # (no linux-modules-extra package for kernel 7.0 on 24.04 or 26.04). When they can't be
      # loaded, the loopback test skips and the run shows a warning instead of failing (TD-18).
      - name: Load ALSA virtual MIDI (Midi Through) for the loopback test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2t64
          if ! sudo modprobe snd-seq-dummy; then
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe snd-seq-dummy || true
          fi
          if [ -e /dev/snd/seq ] && grep -q "Midi Through" /proc/asound/seq/clients 2>/dev/null; then
            sudo chmod a+rw /dev/snd/seq
            echo "METRODOM_REQUIRE_ALSA=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=ALSA loopback skipped::Kernel $(uname -r) has no loadable snd-seq-dummy, so the ALSA round-trip test will skip (TD-18)."
          fi
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
